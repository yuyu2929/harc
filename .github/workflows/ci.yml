name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy pytest
      - run: pytest tests/ -v
      - name: Self-check (roundtrip on odd sizes)
        # Windows runner 上没有 python3，统一用 python；
        # 再兜一层 PYTHONIOENCODING，避免中文输出撞上 cp1252 控制台
        env:
          PYTHONIOENCODING: utf-8
        run: python harc.py

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib
      - name: Run benchmark (results in job log)
        run: python docs/run_benchmark.py
