[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harc-codec"
version = "1.1.0"
description = "HARC — Hybrid Adaptive Raster Coding: lossless raster codec with random access and update-in-place"
readme = "README.md"
requires-python = ">=3.9"
# 双许可：非商业用 PolyForm Noncommercial，商业用途需单独授权。
# 注意这【不是】OSI 开源许可，对外请说 "source-available"，不要写 "open source"。
license = { text = "PolyForm-Noncommercial-1.0.0 OR Commercial (see COMMERCIAL-LICENSE.md)" }
license-files = ["LICENSE.md", "LICENSE-POLYFORM.md", "COMMERCIAL-LICENSE.md"]
authors = [{ name = "yuyu2929" }]
keywords = ["raster", "codec", "gis", "compression", "quadtree", "dem", "remote-sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: Other/Proprietary License",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["harc"]
